# FLIP with Frankenstein experts: no expert training. Expert k is the network frank-k
# rebuilt from the checkpoint bank (frankenstein package), used as the starting point of
# every expert / student step (fresh optimizer state). The flipped labels are then
# evaluated on a victim of unknown architecture (V1).
# Run from flip/: python run_experiment.py frankenstein_attack

# Optimize labels against K = 8 Frankenstein experts (no input_pths -> Frankenstein mode).
[generate_labels]
expert_model = "frank-{}"
trainer = "sgd"
dataset = "cifar"
source_label = 9
target_label = 4
poisoner = "1xs"
output_dir = "experiments/frankenstein_attack/"
lambda = 0.0

[generate_labels.expert_config]
experts = 8

[generate_labels.attack_config]
iterations = 5
one_hot_temp = 5
labels_kwargs = {lr = 150, momentum = 0.5}

# Flip labels at the provided budgets.
[select_flips]
budgets = [150, 300, 500, 1000, 1500]
input_label_glob = "experiments/frankenstein_attack/labels.npy"
true_labels = "experiments/frankenstein_attack/true.npy"
output_dir = "experiments/frankenstein_attack/"

# Train the victim (unknown architecture) on the 1500-flip labels; ASR = poison test accuracy.
[train_user]
input_labels = "experiments/frankenstein_attack/1500.npy"
user_model = "V1"
trainer = "sgd"
dataset = "cifar"
source_label = 9
target_label = 4
poisoner = "1xs"
output_dir = "experiments/frankenstein_attack/V1/"
soft = false
alpha = 0.0
